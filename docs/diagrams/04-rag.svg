<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#F8FAFC"/><rect x="1" y="1" width="1198" height="728" rx="20" fill="none" stroke="#DCE4EE"/><text x="36" y="43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#087F70" text-anchor="start">CLOUDVAULT  /  SYSTEM DESIGN</text><text x="36" y="80" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#14233D" text-anchor="start">Grounded question answering (RAG)</text><text x="36" y="108" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647A" text-anchor="start">Retrieve evidence first, generate locally, validate citations, then return an answer.</text><rect x="40" y="150" width="250" height="85" rx="12" fill="#E8F0FF" stroke="#2455AD" stroke-opacity=".45"/><rect x="40" y="162" width="4" height="61" rx="2" fill="#2455AD"/><text x="165.0" y="179" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#2455AD" text-anchor="middle">01  Question</text><text x="165.0" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">All indexed or selected files</text><text x="165.0" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Bounded conversation context</text><rect x="330" y="150" width="250" height="85" rx="12" fill="#F0EBFF" stroke="#6950B8" stroke-opacity=".45"/><rect x="330" y="162" width="4" height="61" rx="2" fill="#6950B8"/><text x="455.0" y="179" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#6950B8" text-anchor="middle">02  Retrieve</text><text x="455.0" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Dense + lexical passages</text><text x="455.0" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Persistent local index</text><rect x="620" y="150" width="250" height="85" rx="12" fill="#E3F5EF" stroke="#087F70" stroke-opacity=".45"/><rect x="620" y="162" width="4" height="61" rx="2" fill="#087F70"/><text x="745.0" y="179" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#087F70" text-anchor="middle">03  Select evidence</text><text x="745.0" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Rank · deduplicate</text><text x="745.0" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Complementary passages</text><rect x="910" y="150" width="250" height="85" rx="12" fill="#F0F3F7" stroke="#475569" stroke-opacity=".45"/><rect x="910" y="162" width="4" height="61" rx="2" fill="#475569"/><text x="1035.0" y="179" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#475569" text-anchor="middle">04  Evidence check</text><text x="1035.0" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Enough relevant material?</text><polyline points="290,192 330,192" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="580,192 620,192" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="870,192 910,192" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><rect x="910" y="280" width="250" height="80" rx="12" fill="#FCEAEC" stroke="#B13D50" stroke-opacity=".45"/><rect x="910" y="292" width="4" height="56" rx="2" fill="#B13D50"/><text x="1035.0" y="309" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#B13D50" text-anchor="middle">Insufficient evidence</text><text x="1035.0" y="331" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Explain missing information</text><polyline points="1035,235 1035,280" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><text x="1054" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">No</text><rect x="620" y="280" width="250" height="80" rx="12" fill="#E3F5EF" stroke="#087F70" stroke-opacity=".45"/><rect x="620" y="292" width="4" height="56" rx="2" fill="#087F70"/><text x="745.0" y="309" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#087F70" text-anchor="middle">05  Build context</text><text x="745.0" y="331" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Source IDs · quotations</text><text x="745.0" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Bounded token budget</text><polyline points="910,192 890,192 890,263 745,263 745,280" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><text x="832" y="255" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Yes</text><rect x="330" y="280" width="250" height="80" rx="12" fill="#F0EBFF" stroke="#6950B8" stroke-opacity=".45"/><rect x="330" y="292" width="4" height="56" rx="2" fill="#6950B8"/><text x="455.0" y="309" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#6950B8" text-anchor="middle">06  Qwen / Ollama</text><text x="455.0" y="331" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Local generated answer</text><text x="455.0" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">No AWS execution tools</text><polyline points="620,320 580,320" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><rect x="40" y="280" width="250" height="80" rx="12" fill="#E3F5EF" stroke="#087F70" stroke-opacity=".45"/><rect x="40" y="292" width="4" height="56" rx="2" fill="#087F70"/><text x="165.0" y="309" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#087F70" text-anchor="middle">07  Validate</text><text x="165.0" y="331" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Source IDs · exact quotes</text><text x="165.0" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Claim relevance</text><polyline points="330,320 290,320" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><rect x="40" y="450" width="350" height="95" rx="12" fill="#E3F5EF" stroke="#087F70" stroke-opacity=".45"/><rect x="40" y="462" width="4" height="71" rx="2" fill="#087F70"/><text x="215.0" y="479" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#087F70" text-anchor="middle">08  Grounded response</text><text x="215.0" y="501" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Readable answer · clickable citations</text><text x="215.0" y="520" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Preview source or download original</text><polyline points="165,360 165,450" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><text x="190" y="410" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Pass</text><rect x="620" y="450" width="540" height="95" rx="12" fill="#FFF1DF" stroke="#A95A0B" stroke-opacity=".45"/><rect x="620" y="462" width="4" height="71" rx="2" fill="#A95A0B"/><text x="890.0" y="479" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#A95A0B" text-anchor="middle">Explicit extractive fallback</text><text x="890.0" y="501" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Generator unavailable or output fails validation</text><text x="890.0" y="520" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Return cited passages; clearly label answer mode</text><polyline points="455,360 455,400 750,400 750,450" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><text x="601" y="391" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Unavailable</text><polyline points="290,340 310,340 310,423 900,423 900,450" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><text x="515" y="416" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Invalid evidence</text><rect x="40" y="585" width="1120" height="81" rx="16" fill="#F0F3F7" fill-opacity=".45" stroke="#475569" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="58" y="610" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="start">SAFETY &amp; TRACEABILITY</text><text x="60" y="635" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#14233D" text-anchor="start">Documents are untrusted evidence. Citation validation improves traceability but cannot guarantee factual correctness.</text><text x="36" y="709" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#52647A" text-anchor="start">The generation model receives selected passages, not credentials or unrestricted tools.</text></svg>