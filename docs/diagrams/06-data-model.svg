<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#F8FAFC"/><rect x="1" y="1" width="1198" height="508" rx="20" fill="none" stroke="#DCE4EE"/><text x="36" y="43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#087F70" text-anchor="start">CLOUDVAULT  /  SYSTEM DESIGN</text><text x="36" y="80" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#14233D" text-anchor="start">Conceptual persistence model</text><text x="36" y="108" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647A" text-anchor="start">Logical relationships in the local SQLite database; not literal schema DDL.</text><rect x="45" y="155" width="460" height="120" rx="12" fill="#E8F0FF" stroke="#2455AD" stroke-opacity=".45"/><rect x="45" y="167" width="4" height="96" rx="2" fill="#2455AD"/><text x="275.0" y="184" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#2455AD" text-anchor="middle">FILE  ·  parent</text><text x="275.0" y="206" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">id (PK) · object_key · filename</text><text x="275.0" y="225" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">size_bytes · indexing_status</text><text x="275.0" y="244" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">One original object reference</text><rect x="695" y="155" width="460" height="120" rx="12" fill="#F0EBFF" stroke="#6950B8" stroke-opacity=".45"/><rect x="695" y="167" width="4" height="96" rx="2" fill="#6950B8"/><text x="925.0" y="184" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#6950B8" text-anchor="middle">CHUNK  ·  child</text><text x="925.0" y="206" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">id (PK) · file_id (FK)</text><text x="925.0" y="225" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">extracted_text · embedding</text><text x="925.0" y="244" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">source_reference</text><polyline points="505,215 695,215" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><text x="600" y="204" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">1 → 0..many</text><rect x="45" y="320" width="460" height="110" rx="12" fill="#E3F5EF" stroke="#087F70" stroke-opacity=".45"/><rect x="45" y="332" width="4" height="86" rx="2" fill="#087F70"/><text x="275.0" y="349" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#087F70" text-anchor="middle">CONVERSATION  ·  parent</text><text x="275.0" y="371" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">id (PK)</text><text x="275.0" y="390" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Local conversation record</text><rect x="695" y="320" width="460" height="110" rx="12" fill="#F0F3F7" stroke="#475569" stroke-opacity=".45"/><rect x="695" y="332" width="4" height="86" rx="2" fill="#475569"/><text x="925.0" y="349" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#475569" text-anchor="middle">MESSAGE  ·  child</text><text x="925.0" y="371" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">id (PK) · conversation_id (FK)</text><text x="925.0" y="390" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">content</text><polyline points="505,375 695,375" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><text x="600" y="364" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">1 → 0..many</text><text x="36" y="489" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#52647A" text-anchor="start">PK = primary key; FK = foreign key. Local index backup is separate from S3 original storage.</text></svg>