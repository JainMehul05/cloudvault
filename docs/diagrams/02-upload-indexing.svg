<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#F8FAFC"/><rect x="1" y="1" width="1198" height="658" rx="20" fill="none" stroke="#DCE4EE"/><text x="36" y="43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#087F70" text-anchor="start">CLOUDVAULT  /  SYSTEM DESIGN</text><text x="36" y="80" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#14233D" text-anchor="start">Upload &amp; indexing workflow</text><text x="36" y="108" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647A" text-anchor="start">Storage success and content-indexing success are tracked independently.</text><rect x="40" y="150" width="250" height="92" rx="12" fill="#E8F0FF" stroke="#2455AD" stroke-opacity=".45"/><rect x="40" y="162" width="4" height="68" rx="2" fill="#2455AD"/><text x="165.0" y="179" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#2455AD" text-anchor="middle">01  Select file</text><text x="165.0" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Drag and drop</text><text x="165.0" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">or browse</text><rect x="330" y="150" width="250" height="92" rx="12" fill="#E8F0FF" stroke="#2455AD" stroke-opacity=".45"/><rect x="330" y="162" width="4" height="68" rx="2" fill="#2455AD"/><text x="455.0" y="179" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#2455AD" text-anchor="middle">02  Validate</text><text x="455.0" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Name · size</text><text x="455.0" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Unique object key</text><rect x="620" y="150" width="250" height="92" rx="12" fill="#FFF1DF" stroke="#A95A0B" stroke-opacity=".45"/><rect x="620" y="162" width="4" height="68" rx="2" fill="#A95A0B"/><text x="745.0" y="179" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#A95A0B" text-anchor="middle">03  Store original</text><text x="745.0" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Private S3</text><text x="745.0" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Authenticated upload</text><rect x="910" y="150" width="250" height="92" rx="12" fill="#E3F5EF" stroke="#087F70" stroke-opacity=".45"/><rect x="910" y="162" width="4" height="68" rx="2" fill="#087F70"/><text x="1035.0" y="179" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#087F70" text-anchor="middle">04  Save metadata</text><text x="1035.0" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">SQLite record</text><text x="1035.0" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Indexing status</text><polyline points="290,196 330,196" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="580,196 620,196" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="870,196 910,196" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><rect x="330" y="285" width="250" height="76" rx="12" fill="#FCEAEC" stroke="#B13D50" stroke-opacity=".45"/><rect x="330" y="297" width="4" height="52" rx="2" fill="#B13D50"/><text x="455.0" y="314" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#B13D50" text-anchor="middle">Validation error</text><text x="455.0" y="336" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Reject invalid input</text><polyline points="455,242 455,285" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><rect x="620" y="285" width="250" height="76" rx="12" fill="#FCEAEC" stroke="#B13D50" stroke-opacity=".45"/><rect x="620" y="297" width="4" height="52" rx="2" fill="#B13D50"/><text x="745.0" y="314" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#B13D50" text-anchor="middle">Storage failure</text><text x="745.0" y="336" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Report cloud error</text><polyline points="745,242 745,285" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><rect x="910" y="285" width="250" height="76" rx="12" fill="#E3F5EF" stroke="#087F70" stroke-opacity=".45"/><rect x="910" y="297" width="4" height="52" rx="2" fill="#087F70"/><text x="1035.0" y="314" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#087F70" text-anchor="middle">Extract content</text><text x="1035.0" y="336" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Supported file formats</text><polyline points="1035,242 1035,285" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><rect x="40" y="420" width="250" height="92" rx="12" fill="#E3F5EF" stroke="#087F70" stroke-opacity=".45"/><rect x="40" y="432" width="4" height="68" rx="2" fill="#087F70"/><text x="165.0" y="449" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#087F70" text-anchor="middle">08  Indexed</text><text x="165.0" y="471" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Searchable passages</text><text x="165.0" y="490" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Original retained</text><rect x="330" y="420" width="250" height="92" rx="12" fill="#E8F0FF" stroke="#2455AD" stroke-opacity=".45"/><rect x="330" y="432" width="4" height="68" rx="2" fill="#2455AD"/><text x="455.0" y="449" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#2455AD" text-anchor="middle">07  Persist index</text><text x="455.0" y="471" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Chunks + vectors</text><text x="455.0" y="490" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Update status</text><rect x="620" y="420" width="250" height="92" rx="12" fill="#F0EBFF" stroke="#6950B8" stroke-opacity=".45"/><rect x="620" y="432" width="4" height="68" rx="2" fill="#6950B8"/><text x="745.0" y="449" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#6950B8" text-anchor="middle">06  Embed chunks</text><text x="745.0" y="471" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">MiniLM · 384-D</text><text x="745.0" y="490" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Normalize vectors</text><rect x="910" y="420" width="250" height="92" rx="12" fill="#E3F5EF" stroke="#087F70" stroke-opacity=".45"/><rect x="910" y="432" width="4" height="68" rx="2" fill="#087F70"/><text x="1035.0" y="449" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#087F70" text-anchor="middle">05  Chunk text</text><text x="1035.0" y="471" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Token-aware overlap</text><text x="1035.0" y="490" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Source references</text><polyline points="1035,361 1035,420" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="910,466 870,466" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="620,466 580,466" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="330,466 290,466" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><rect x="620" y="555" width="540" height="63" rx="12" fill="#FCEAEC" stroke="#B13D50" stroke-opacity=".45"/><rect x="620" y="567" width="4" height="39" rx="2" fill="#B13D50"/><text x="890.0" y="584" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#B13D50" text-anchor="middle">Unsupported / empty / indexing failed</text><text x="890.0" y="606" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Keep original in S3; expose status and retry when applicable</text><polyline points="1035,512 1035,555" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="745,512 745,555" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><text x="36" y="639" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#52647A" text-anchor="start">Only supported, successfully extracted content becomes available for content search.</text></svg>