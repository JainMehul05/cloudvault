<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="575" viewBox="0 0 1200 575"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#F8FAFC"/><rect x="1" y="1" width="1198" height="573" rx="20" fill="none" stroke="#DCE4EE"/><text x="36" y="43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#087F70" text-anchor="start">CLOUDVAULT  /  SYSTEM DESIGN</text><text x="36" y="80" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#14233D" text-anchor="start">Smart Search pipeline</text><text x="36" y="108" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647A" text-anchor="start">Four retrieval modes share a persistent corpus and file-level result presentation.</text><rect x="450" y="140" width="300" height="72" rx="12" fill="#E8F0FF" stroke="#2455AD" stroke-opacity=".45"/><rect x="450" y="152" width="4" height="48" rx="2" fill="#2455AD"/><text x="600.0" y="169" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#2455AD" text-anchor="middle">Query + selected scope</text><text x="600.0" y="191" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Validate input and filters</text><rect x="30" y="280" width="255" height="80" rx="12" fill="#F0F3F7" stroke="#475569" stroke-opacity=".45"/><rect x="30" y="292" width="4" height="56" rx="2" fill="#475569"/><text x="157.5" y="309" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#475569" text-anchor="middle">Filename</text><text x="157.5" y="331" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#34465D" text-anchor="middle">Match display names</text><polyline points="600,212 600,246 157.5,246 157.5,280" fill="none" stroke